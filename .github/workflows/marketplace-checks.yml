name: Marketplace checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Repository uses bun.lock, not npm package-lock.json; npm ci fails here.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run check:runtime
      - run: npm run worker:valr:build
      - run: npm run worker:valr:live:build
      - run: npm run worker:propdao:live:build
        # Local fixtures only; live venue credentials are never required.
