name: PropDAO Runtime Checks
on:
  pull_request:
    paths:
      - 'server/propdao-*'
      - 'workers/propdao-*'
      - 'shared/propdao-*'
      - '.github/workflows/propdao-runtime.yml'
  push:
    branches: [main, codex/propdao-live-activation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --reporter=dot
      - run: npm run check:runtime
      - run: npm run build
